<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IELTS Listening</title>
<style>
:root{--bg:#fff;--fg:#1c1c28;--mut:#6b7280;--bd:#e5e7eb;--card:#fff;--acc:#d9261c;--accb:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#15161c;--fg:#e8e8ee;--mut:#9aa0ac;--bd:#2d2f3a;--card:#1d1f27;--accb:#3a1c1a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}button:hover{border-color:var(--acc)}button:disabled{opacity:.5;cursor:default}
.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}.muted{color:var(--mut);font-size:13px}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);flex-wrap:wrap}.sp{flex:1}.logo{color:var(--acc);font-weight:800}
.badge{padding:4px 10px;border-radius:20px;font-weight:700;font-size:12px;background:var(--accb);color:var(--acc)}.exam{background:var(--acc);color:#fff}
#ab{padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}#ab input[type=range]{flex:1;min-width:120px}
main{flex:1;overflow-y:auto;padding:16px 20px;max-width:860px;width:100%;margin:0 auto}
.sec{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:6px 18px 14px;margin-bottom:16px}.sec.lock{opacity:.35;pointer-events:none}
.q{padding:10px 0;border-top:1px solid var(--bd)}.q b{color:var(--acc)}.q label{display:block;padding:5px 0;cursor:pointer}
.q input[type=text]{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;width:150px}
footer{border-top:1px solid var(--bd);padding:8px 16px;display:flex;gap:5px;overflow-x:auto}.n{min-width:34px;height:34px;border-radius:50%;padding:0}.n.done{background:var(--fg);color:var(--bg)}
.card{border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:16px;margin:12px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.mb{background:var(--card);border-radius:16px;padding:20px;max-width:460px;width:100%}
#big{font-variant-numeric:tabular-nums;font-weight:700}
</style></head><body><div id="app" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SB={u:"https://kbagsmnlqphccfiljytk.supabase.co",k:"sb_publishable_iu-5SuzWzybaLDFAsx6RtQ_3IixmRjJ"};
let att=null,syncT=null,beat=null,who=null,curSec=0;try{who=JSON.parse(localStorage.getItem("ielts_who")||"null")}catch(e){}
const uid=()=>crypto.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=="x"?r:r&3|8).toString(16)});
function sync(){if(!L||!att)return;clearTimeout(syncT);const Q=qs(),lab=mode==="exam"?({read:"Đọc trước",play:"Đang nghe",review:"Chép đáp án",err:"Lỗi âm thanh"}[phase]||""):(aud.paused?"Tạm dừng":"Đang nghe");fetch(SB.u+"/rest/v1/rpc/save_attempt",{method:"POST",headers:{apikey:SB.k,"Content-Type":"application/json"},keepalive:true,body:JSON.stringify({p_id:att.id,p_token:att.token,p_student:att.name,p_class:att.cls||"",p_test:(L.title||"")+" (Listening)",p_data:{kind:"listening",mode,ans,sec:curSec+1,maxn:Math.max(...Q.map(i=>i.n)),lab,pct:aud.duration?Math.round(aud.currentTime/aud.duration*100):0},p_answered:Object.keys(ans).length,p_total:Q.length,p_status:done?"done":"doing"})}).catch(()=>{})}
function syncSoon(){clearTimeout(syncT);syncT=setTimeout(sync,1200)}
function nf(){const st='style="width:100%;padding:10px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit"';return`<input id="wn" ${st} placeholder="Họ và tên" value="${esc(who&&who.name||"")}"><input id="wc" ${st} placeholder="Mã lớp (nếu có)" value="${esc(who&&who.cls||"")}">`}
function getWho(){const n=$("#wn").value.trim();if(!n){alert("Vui lòng nhập họ tên");return false}who={name:n,cls:$("#wc").value.trim()};try{localStorage.setItem("ielts_who",JSON.stringify(who))}catch(e){}return true}
let tests=[],L,mode,sel=[],ans={},done=false,aud=new Audio(),k=0,phase="",endAt=0,tk,A=null,B=null,t0=0;
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function modal(h){closeM();const m=document.createElement("div");m.id="modal";m.innerHTML='<div class="mb">'+h+'</div>';document.body.appendChild(m)}
function closeM(){const m=$("#modal");m&&m.remove()}
async function home(){clearInterval(tk);clearInterval(beat);aud.pause();window.onbeforeunload=null;closeM();
$("#app").innerHTML='<header><span class="logo">IELTS Listening</span><span class="sp"></span><a href="index.html" style="text-decoration:none"><button>📖 Reading</button></a></header><main><h2>Chọn đề nghe</h2><div id="list">Đang tải…</div></main>';
if(!tests.length)try{const idx=await (await fetch("listening/index.json?"+Date.now())).json();for(const f of idx){try{const t=await (await fetch("listening/"+f+"?"+Date.now())).json();let n=0;t.sections.forEach(s=>s.groups.forEach(g=>g.items.forEach(i=>i.n=++n)));t.total=n;tests.push(t)}catch(e){}}}catch(e){}
$("#list").innerHTML=tests.length?tests.map((t,i)=>{const m=t.modes||["practice","exam"];return`<div class="card"><div><b>${esc(t.title)}</b><div class="muted">${t.sections.length} section · ${t.total} câu</div></div><div>${m.includes("practice")?`<button onclick="pick(${i},'practice')">Luyện tập</button> `:""}${m.includes("exam")?`<button class="pri" onclick="pick(${i},'exam')">Thi thật</button>`:""}</div></div>`}).join(""):'<p class="muted">Chưa có đề nào.</p>'}
function pick(i,m){L=tests[i];mode=m;if(m==="practice"){modal(`<h3 style="margin:0 0 8px">Chọn section luyện</h3>${nf()}${L.sections.map((s,j)=>`<label style="display:block;padding:5px 0"><input type="checkbox" class="cs" value="${j}" checked> ${esc(s.title)}</label>`).join("")}<div style="display:flex;justify-content:space-between;margin-top:12px"><button onclick="closeM()">Hủy</button><button class="pri" onclick="startP()">Bắt đầu</button></div>`)}
else modal(`<h3 style="margin:0 0 8px">Thi thật</h3>${nf()}<p class="muted">Âm thanh chỉ phát một lần, không tạm dừng hay tua. Hãy kiểm tra loa trước khi bắt đầu.</p><button onclick="beep()">🔊 Nghe thử</button><div style="display:flex;justify-content:space-between;margin-top:14px"><button onclick="closeM()">Hủy</button><button class="pri" onclick="startE()">Bắt đầu thi</button></div>`)}
function beep(){const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=440;o.start();o.stop(c.currentTime+.6)}
function startP(){sel=[...document.querySelectorAll(".cs:checked")].map(x=>+x.value);if(!sel.length||!getWho())return;closeM();begin()}
function startE(){if(!getWho())return;sel=L.sections.map((_,j)=>j);closeM();aud.muted=true;aud.src=L.sections[0].audio;aud.play().then(()=>{aud.pause();aud.muted=false}).catch(()=>{aud.muted=false});begin()}
function begin(){ans={};done=false;k=0;t0=Date.now();att={id:uid(),token:uid(),name:who.name,cls:who.cls};clearInterval(beat);beat=setInterval(sync,8000);syncSoon();render();if(mode==="exam"){window.onbeforeunload=()=>"Bài thi đang diễn ra";runE(0)}else{setAud(sel[0]);tk=setInterval(tick,300)}}
function qs(){return sel.flatMap(j=>L.sections[j].groups.flatMap(g=>g.items))}
function render(ro){const Q=qs();$("#app").innerHTML=`<header><span class="badge ${mode==="exam"?"exam":""}">${mode==="exam"?"THI THẬT":"LUYỆN TẬP"}</span><b>${esc(L.title)}</b><span class="sp"></span><span id="big"></span>${mode==="practice"&&!ro?'<button class="pri" onclick="submit()">Nộp bài</button>':""}${ro?'<button onclick="fin()">← Quay lại</button>':""}</header><div id="ab"></div>
<main>${sel.map(j=>secHTML(j,ro)).join("")}</main><footer>${Q.map(i=>`<button class="n ${ans[i.n]?"done":""}" id="n${i.n}" onclick="document.getElementById('q${i.n}').scrollIntoView({behavior:'smooth',block:'center'})">${i.n}</button>`).join("")}</footer>`;
if(ro)$("#ab").style.display="none";else abar()}
function secHTML(j,ro){const s=L.sections[j];return`<div class="sec ${mode==="exam"&&j!==sel[k]?"lock":""}" id="s${j}"><h3>${esc(s.title)}</h3>`+s.groups.map(g=>`<p><b>${esc(g.instruction||"")}</b></p>`+g.items.map(it=>`<div class="q" id="q${it.n}">`+qHTML(g,it,ro)+`</div>`).join("")).join("")+(ro&&s.transcript?`<details><summary>Xem transcript</summary><p>${esc(s.transcript)}</p></details>`:"")+`</div>`}
function qHTML(g,it,ro){const v=ans[it.n],d=ro?"disabled":"";
if(g.type==="mcq")return`<b>${it.n}.</b> ${esc(it.q)}`+it.o.map((x,i)=>`<label><input type="radio" name="r${it.n}" ${v===i?"checked":""} ${d} onchange="setA(${it.n},${i})"> ${String.fromCharCode(65+i)}. ${esc(x)}</label>`).join("");
const inp=`<input type="text" value="${esc(v||"")}" ${d} oninput="setA(${it.n},this.value)" autocomplete="off">`;return/_{3,}/.test(it.q)?`<b>${it.n}.</b> `+esc(it.q).replace(/_{3,}/,inp):`<b>${it.n}.</b> ${esc(it.q)} ${inp}`}
function setA(n,v){if(v===""||v==null)delete ans[n];else ans[n]=v;const b=$("#n"+n);b&&b.classList.toggle("done",ans[n]!==undefined);syncSoon()}
/* ----- thi thật ----- */
function runE(i){k=i;curSec=sel[k];document.querySelectorAll(".sec").forEach(e=>e.classList.add("lock"));const e=$("#s"+sel[k]);e&&e.classList.remove("lock");phase="read";endAt=Date.now()+(L.readSeconds||30)*1000;clearInterval(tk);tk=setInterval(tick,250);abar()}
function playE(){phase="play";aud.muted=false;aud.src=L.sections[sel[k]].audio;aud.onended=()=>{if(k+1<sel.length)runE(k+1);else{phase="review";endAt=Date.now()+(L.reviewSeconds||120)*1000;document.querySelectorAll(".sec").forEach(e=>e.classList.remove("lock"));abar()}};aud.onpause=()=>{if(!aud.ended&&phase==="play"&&!done)aud.play().catch(()=>{})};aud.play().catch(()=>{phase="err";abar()})}
function tick(){const big=$("#big");if(mode==="exam"){const r=(endAt-Date.now())/1000;if(phase==="read"){big&&(big.textContent="Đọc trước "+fmt(r));if(r<=0)playE()}else if(phase==="review"){big&&(big.textContent="Chép đáp án "+fmt(r));if(r<=0)submit()}else if(phase==="play"){big&&(big.textContent="Đang phát "+fmt(aud.duration-aud.currentTime));const p=$("#pg");p&&aud.duration&&(p.value=aud.currentTime/aud.duration*100)}}
else{big&&(big.textContent="Đã dùng "+fmt((Date.now()-t0)/1000));const p=$("#sk");if(p&&aud.duration&&!p.dataset.drag)p.value=aud.currentTime/aud.duration*100;if(A!=null&&B!=null&&aud.currentTime>=B)aud.currentTime=A}}
/* ----- luyện tập ----- */
function setAud(j){curSec=j;aud.onended=null;aud.onpause=null;aud.src=L.sections[j].audio;A=B=null;abar()}
function abar(){const ab=$("#ab");if(!ab)return;if(mode==="exam"){ab.innerHTML=phase==="err"?'<span class="bad">Không phát được âm thanh.</span> <button class="pri" onclick="playE()">Thử lại</button>':`<b>${esc(L.sections[sel[Math.min(k,sel.length-1)]].title)}</b><input type="range" id="pg" min="0" max="100" value="0" disabled> 🔊 <input type="range" min="0" max="100" value="100" style="max-width:90px" oninput="aud.volume=this.value/100">`;return}
ab.innerHTML=`<select onchange="setAud(+this.value)">${sel.map(j=>`<option value="${j}">${esc(L.sections[j].title)}</option>`).join("")}</select><button onclick="aud.paused?aud.play():aud.pause()">⏯</button><button onclick="aud.currentTime-=5">−5s</button><button onclick="aud.currentTime+=5">+5s</button><input type="range" id="sk" min="0" max="100" step="0.1" value="0" oninput="this.dataset.drag=1;aud.currentTime=this.value/100*aud.duration" onchange="delete this.dataset.drag"><select onchange="aud.playbackRate=+this.value">${[.75,1,1.25,1.5].map(x=>`<option ${x===1?"selected":""} value="${x}">${x}x</option>`).join("")}</select><button onclick="A=aud.currentTime;B=null">A</button><button onclick="B=aud.currentTime">B</button><button onclick="A=B=null">Xóa lặp</button>`}
document.addEventListener("keydown",e=>{if(mode==="practice"&&!done&&aud.src&&!/INPUT|SELECT/.test(e.target.tagName)){if(e.key==="ArrowLeft")aud.currentTime-=5;if(e.key==="ArrowRight")aud.currentTime+=5}});
function submit(auto){if(!auto&&mode==="practice"&&Object.keys(ans).length<qs().length&&!confirm("Bạn còn câu chưa làm. Vẫn nộp bài?"))return;done=true;clearInterval(tk);clearInterval(beat);aud.pause();window.onbeforeunload=null;sync();fin()}
function fin(){$("#app").innerHTML=`<header><span class="logo">IELTS Listening</span></header><main style="text-align:center;padding-top:60px"><div style="font-size:56px">✅</div><h1>Bạn đã hoàn thành bài ${mode==="exam"?"thi":"luyện tập"}</h1><p class="muted">${esc(L.title)}<br>Đã trả lời ${Object.keys(ans).length} / ${qs().length} câu</p><button onclick="render(true)">Xem lại bài</button> <button class="pri" onclick="home()">Về trang chủ</button></main>`}
home();
</script></body></html>
